{% extends "base.html" %}

{% block titulo %}Entrar{% endblock %}

{% block conteudo %}
<div class="cartao login">
  <div class="login-marca">🧱</div>
  <h1>Materiais de Construção</h1>
  <p class="login-sub">Acesse o sistema</p>

  {% if form.errors %}
    <p class="mensagem error">Usuário ou senha incorretos.</p>
  {% endif %}

  <form method="post" class="formulario">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="botao-largo">Entrar</button>
  </form>
</div>
{% endblock %}
