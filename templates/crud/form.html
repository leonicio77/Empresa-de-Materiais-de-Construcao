{% extends "base.html" %}

{% block titulo %}{{ nome|capfirst }}{% endblock %}

{% block conteudo %}
<div class="cartao formulario">
  <h1>{{ nome|capfirst }}: {% if object %}editar{% else %}novo cadastro{% endif %}</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Salvar</button>
    <a href="{% url url_lista %}">Cancelar</a>
  </form>
</div>
{% endblock %}
