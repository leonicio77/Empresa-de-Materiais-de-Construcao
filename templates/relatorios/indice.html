{% extends "base.html" %}

{% block titulo %}Relatórios{% endblock %}

{% block conteudo %}
<h1>Relatórios</h1>

<div class="grade">
  {% for slug, r in relatorios %}
  <div class="cartao">
    <h2>{{ r.titulo }}</h2>
    <p>{{ r.descricao }}</p>
    <a class="botao" href="{% url 'relatorio' slug %}">Abrir</a>
  </div>
  {% endfor %}
</div>
{% endblock %}
