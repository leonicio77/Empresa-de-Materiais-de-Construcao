{% extends "base.html" %}

{% block titulo %}Entrar{% endblock %}

{% block conteudo %}
<div class="cartao login">
  <h1>Acessar o sistema</h1>
  {% if form.errors %}
    <p class="erro">Usuário ou senha incorretos.</p>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Entrar</button>
  </form>
</div>
{% endblock %}
